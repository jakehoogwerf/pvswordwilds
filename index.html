/* ===================== PLAY WITH FRIENDS (Supabase Realtime) ===================== */
/* Rooms use Supabase Realtime “broadcast” and “presence”, so no database tables are needed.
   Add the project URL and anon key in ONLINE_CONFIG at the top of this script, or in Teacher settings. */
const NET = { sb: null, ch: null, code: null, pid: null, status: "off", peers: [], trade: null, pvp: null, incoming: null, ask: null };
function netCfg() {
  const u = ((settings && settings.sbUrl) || ONLINE_CONFIG.url || "").trim(), k = ((settings && settings.sbKey) || ONLINE_CONFIG.anonKey || "").trim();
  return u && k ? { u, k } : null;
}
let SB_LOAD = null;
function loadSupabase() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
  if (!SB_LOAD) SB_LOAD = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
    s.onload = () => window.supabase ? res(window.supabase) : rej(new Error("load"));
    s.onerror = () => { SB_LOAD = null; rej(new Error("load")); };
    document.head.appendChild(s);
  });
  return SB_LOAD;
}
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join("");
function meInfo() { return { pid: NET.pid, name: save.name || "Explorer", colour: save.colour || "blue", dex: dexCount(), badges: Object.values(save.badges || {}).filter(Boolean).length }; }
function peersNow() { if (!NET.ch) return []; return Object.values(NET.ch.presenceState()).map(a => a && a[0]).filter(p => p && p.pid && p.pid !== NET.pid); }
function netMsg(t) { const m = document.getElementById("netmsg"); if (m) m.textContent = t; else toast(t); }
async function joinRoom(code) {
  const cfg = netCfg(); if (!cfg) return showOnline();
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 5) { netMsg("Room codes have 5 letters and numbers. Check the code and try again."); return; }
  netMsg("Connecting…");
  try {
    const lib = await loadSupabase();
    if (!NET.sb) NET.sb = lib.createClient(cfg.u, cfg.k, { auth: { persistSession: false, autoRefreshToken: false }, realtime: { params: { eventsPerSecond: 20 } } });
    await leaveRoom(true);
    NET.pid = NET.pid || ("u" + Math.random().toString(36).slice(2, 10));
    const ch = NET.sb.channel("wordwilds-" + code, { config: { presence: { key: NET.pid }, broadcast: { self: false } } });
    NET.ch = ch; NET.code = code; NET.status = "joining";
    ch.on("presence", { event: "sync" }, onPeers);
    ch.on("broadcast", { event: "m" }, msg => onNet(msg.payload || {}));
    ch.on("broadcast", { event: "p" }, msg => onPos(msg.payload || {}));
    const timer = setTimeout(() => { if (NET.status === "joining") { NET.status = "error"; leaveRoom(true); netMsg("Couldn’t connect. Check the internet connection, then try again."); } }, 12000);
    ch.subscribe(async st => {
      if (st === "SUBSCRIBED" && NET.ch === ch) { clearTimeout(timer); NET.status = "on"; await ch.track(meInfo()); clearInterval(NET.hb); NET.hb = setInterval(() => netPos(true), 3000); netPos(true); showRoom(); }
      else if ((st === "CHANNEL_ERROR" || st === "TIMED_OUT") && NET.ch === ch) { clearTimeout(timer); NET.status = "error"; leaveRoom(true); netMsg("Couldn’t connect to the room. Ask your teacher to check the online settings."); }
    });
  } catch (e) { NET.status = "error"; netMsg("Online play couldn’t load. Check the internet connection, then try again."); }
}
async function leaveRoom(quiet) {
  const ch = NET.ch; NET.ch = null; NET.code = null; NET.peers = []; NET.trade = null; NET.pvp = null; NET.others = {}; NET.lastPos = null; clearInterval(NET.hb);
  if (NET.status !== "error") NET.status = "off";
  if (ch) { try { await ch.untrack(); } catch (e) {} try { NET.sb && NET.sb.removeChannel(ch); } catch (e) {} }
  if (!quiet) showOnline();
}
function netTrackMe() { if (NET.ch && NET.status === "on") { try { NET.ch.track(meInfo()); } catch (e) {} } }
function netSend(to, type, data = {}) {
  if (!NET.ch) return;
  try { NET.ch.send({ type: "broadcast", event: "m", payload: Object.assign({ to, from: NET.pid, name: save.name || "Explorer", colour: save.colour || "blue", type }, data) }); } catch (e) {}
}
function onPeers() {
  const before = NET.peers.map(p => p.pid);
  NET.peers = peersNow();
  Object.keys(NET.others).forEach(pid => { if (!NET.peers.some(p => p.pid === pid)) delete NET.others[pid]; });
  if (NET.peers.some(p => !before.includes(p.pid))) netPos(true);
  const here = pid => NET.peers.some(p => p.pid === pid);
  if (NET.trade && !here(NET.trade.pid)) { const n = NET.trade.name; NET.trade = null; toast(`${n} left the room.`); if (app.dataset.screen === "trade") netBack(); }
  if (BT && BT.mode === "pvp" && !BT.over && !here(BT.opp)) { BT.q = BT.q.then(async () => { if (BT.over) return; battleMsg(`${esc(BT.leaderName)} left the room. You win!`); await sleepW(900); endBattle(true); }); }
  if (app.dataset.screen === "room") showRoom();
  const d = document.querySelector('[data-act="online"] .dot'); if (d) d.textContent = NET.peers.length;
}
const isBusy = () => !!(NET.trade || (NET.pvp && !(BT && BT.over)) || (BT && !BT.over && app.dataset.screen === "battle") || qState || DLG || !ov.hidden ||
  ["encounter", "evolve", "hatch", "battle", "teampick", "tradeanim"].includes(app.dataset.screen));
function onNet(p) {
  if (!p || p.to !== NET.pid) return;
  const kind = { treq: "trade", breq: "battle" }[p.type];
  if (kind) {
    if (isBusy()) { netSend(p.from, "busy", {}); return; }
    NET.incoming = { kind, from: p.from, name: p.name, colour: p.colour }; SFX.encounter();
    showModal(`<div class="qcard center" role="dialog" aria-modal="true">${trainerPreview(p.colour || "blue", 64)}
      <h2>${esc(p.name)} wants to ${kind === "trade" ? "trade" : "battle"}!</h2>
      <p>${kind === "trade" ? "You can each choose a creature to swap." : `Friend battles use Lv ${PVP_LV} for everyone, so it’s all about your answers.`}</p>
      <div class="row" style="justify-content:center"><button class="btn" data-act="netYes">${kind === "trade" ? "🤝 Let’s trade" : "⚔️ Let’s battle"}</button><button class="btn ghost" data-act="netNo">No thanks</button></div></div>`);
    return;
  }
  switch (p.type) {
    case "no": NET.ask = null; toast(`${p.name} said no thanks this time.`); break;
    case "busy": NET.ask = null; toast(`${p.name} is busy right now. Try again soon.`); break;
    case "tyes": NET.ask = null; startTrade(p.from, p.name, p.colour); break;
    case "byes": NET.ask = null; pvpSetup(p.from, p.name, p.colour, true); break;
    case "toffer": if (NET.trade && NET.trade.pid === p.from) { NET.trade.theirs = sanitizeOffer(p.offer); NET.trade.myReady = false; NET.trade.theirReady = null; showTrade(); } break;
    case "tready": if (NET.trade && NET.trade.pid === p.from) { NET.trade.theirReady = { mine: p.mine, theirs: p.theirs }; if (!tryCommit()) showTrade(); } break;
    case "tcancel": if (NET.trade && NET.trade.pid === p.from) { NET.trade = null; toast(`${p.name} cancelled the trade.`); if (app.dataset.screen === "trade") netBack(); } break;
    case "bteam": if (NET.pvp && NET.pvp.pid === p.from) { NET.pvp.theirs = (p.team || []).filter(t => SPECIES[t.id] && SPECIES[t.id].type).slice(0, 3); pvpMaybeStart(); } break;
    case "bmove": case "bberry": case "bswitch": case "bquit": pvpOnMsg(p); break;
  }
}
function netYes() {
  const inc = NET.incoming; closeModal(); if (!inc) return; NET.incoming = null;
  if (inc.kind === "trade") { netSend(inc.from, "tyes", {}); startTrade(inc.from, inc.name, inc.colour); }
  else { netSend(inc.from, "byes", {}); pvpSetup(inc.from, inc.name, inc.colour, false); }
}
function netNo() { const inc = NET.incoming; closeModal(); if (inc) netSend(inc.from, "no", {}); NET.incoming = null; }
function netAsk(pid, kind) {
  const peer = NET.peers.find(x => x.pid === pid); if (!peer) return;
  if (kind === "trade" && dexCount() < 2) { toast("You need at least 2 creatures to trade."); return; }
  NET.ask = { pid, kind }; netSend(pid, kind === "trade" ? "treq" : "breq", {});
  toast(`Asked ${peer.name} to ${kind}. Waiting for an answer…`);
}

/* ---------- save codes ---------- */
const b64u = bytes => { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = str => { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };
async function pipe(bytes, stream) { const out = new Response(new Blob([bytes]).stream().pipeThrough(stream)); return new Uint8Array(await out.arrayBuffer()); }
async function encodeSave() {
  const p = profiles().find(x => x.id === activeId()) || {};
  const slim = JSON.parse(JSON.stringify(save)); delete slim.seenAt;
  const pg = { cats: prog.cats, asked: prog.asked };
  const json = JSON.stringify({ v: 2, n: p.name || save.name, c: p.colour || save.colour, s: slim, p: pg });
  const raw = new TextEncoder().encode(json);
  if (window.CompressionStream) { try { return "WW2-" + b64u(await pipe(raw, new CompressionStream("deflate-raw"))); } catch (e) {} }
  return "WW2U-" + b64u(raw);
}
async function decodeSave(code) {
  const c = (code || "").replace(/\s+/g, "");
  let bytes;
  if (c.startsWith("WW2-")) { if (!window.DecompressionStream) throw new Error("old"); bytes = await pipe(unb64u(c.slice(4)), new DecompressionStream("deflate-raw")); }
  else if (c.startsWith("WW2U-")) bytes = unb64u(c.slice(5));
  else throw new Error("format");
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || d.v !== 2 || !d.s || typeof d.s !== "object") throw new Error("format");
  return d;
}
async function showSaveMenu() {
  clearInterval(zoneTimer);
  app.dataset.screen = "savemenu"; persist();
  const p = profiles().find(x => x.id === activeId()) || {};
  app.innerHTML = topbar("explore") + `<h2 class="center">💾 Save</h2>
    <div class="panel savepanel"><div class="saveok">✅</div><div><b>Your game saves by itself on this device.</b><p class="hint">Playing as ${esc(p.name || save.name || "Explorer")}. You can carry on next time from “Who’s playing?”.</p></div></div>
    <div class="panel"><h3>🔑 Save code</h3><p class="hint">Want to play on a different device? Copy this code and keep it somewhere safe, like your class page or an email to your teacher. Then choose “Load a save code” on the other device.</p>
      <textarea id="scode" class="codebox" readonly aria-label="Your save code">Making your code…</textarea>
      <div class="row"><button class="btn" data-act="copyCode">📋 Copy code</button><button class="btn ghost" data-act="dlSave" id="dlbtn" hidden>⬇️ Download save file</button></div>
      <p class="tip" id="cmsg" aria-live="polite"></p></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="profiles">👥 Switch player</button><button class="btn ghost" data-act="loadCode">Load a save code</button></div>
    ${navbar("map")}`;
  try { document.getElementById("scode").value = await encodeSave(); } catch (e) { document.getElementById("scode").value = "Sorry, a code couldn’t be made on this device."; }
  downloadsApi().then(d => { const b = document.getElementById("dlbtn"); if (b && d) b.hidden = false; });
}
let DLAPI;
function downloadsApi() {
  if (DLAPI !== undefined) return Promise.resolve(DLAPI);
  if (!window.claude || !window.claude.use) return Promise.resolve(DLAPI = null);
  return Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 4000))]).then(d => (DLAPI = d || null)).catch(() => (DLAPI = null));
}
async function copyCode() {
  const t = document.getElementById("scode"), m = document.getElementById("cmsg");
  try { await navigator.clipboard.writeText(t.value); m.textContent = "Copied! Paste it somewhere safe."; SFX.coin(); }
  catch (e) { t.focus(); t.select(); m.textContent = "Your code is selected. Copy it with your device’s copy button."; }
}
async function dlSave() {
  const d = await downloadsApi(), m = document.getElementById("cmsg"); if (!d) return;
  const name = (save.name || "explorer").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  try { await d.save({ filename: `word-wilds-${name}.txt`, data: document.getElementById("scode").value }); m.textContent = "Save file downloaded."; }
  catch (e) { m.textContent = e && e.code === "declined" ? "No problem. You can still copy the code." : "Downloading isn’t available here. Copy the code instead."; if (e && e.code !== "declined") document.getElementById("dlbtn").hidden = true; }
}
let PENDING = null;
function showLoadCode() {
  app.dataset.screen = "loadcode"; PENDING = null;
  app.innerHTML = `<h2 class="center">🔑 Load a save code</h2>
    <div class="panel"><p class="hint">Paste your save code here, or open a save file.</p>
      <textarea id="lcode" class="codebox" placeholder="WW2-…" aria-label="Paste your save code"></textarea>
      <div class="row"><button class="btn" data-act="checkCode">Check code</button>
        <label class="btn ghost filebtn">📂 Open save file<input type="file" id="lfile" accept=".txt,text/plain" hidden></label></div>
      <p class="tip" id="lmsg" aria-live="polite"></p><div id="lprev"></div></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="profiles">Back</button></div>`;
  document.getElementById("lfile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    document.getElementById("lcode").value = (await f.text()).trim(); checkCode();
  });
}
async function checkCode() {
  const m = document.getElementById("lmsg"), pv = document.getElementById("lprev");
  try {
    const d = await decodeSave(document.getElementById("lcode").value);
    PENDING = d;
    const n = Object.keys(d.s.team || {}).length, bd = Object.values(d.s.badges || {}).filter(Boolean).length;
    m.textContent = "";
    const same = profiles().find(p => p.name.toLowerCase() === String(d.n || "").toLowerCase());
    pv.innerHTML = `<div class="pcard big">${trainerPreview(d.c || "blue")}<b>${esc(d.n || "Explorer")}</b><small>📖 ${n}/${SPECIES_LIST.length}  🏅 ${bd}  🪙 ${d.s.coins || 0}</small></div>
      <div class="row" style="justify-content:center">${same ? `<button class="btn" data-act="importCode" data-arg="${same.id}">Update ${esc(same.name)}’s game</button>` : ""}<button class="btn ${same ? "ghost" : ""}" data-act="importCode" data-arg="new">Add as a new player</button></div>`;
  } catch (e) {
    PENDING = null; pv.innerHTML = "";
    m.textContent = e.message === "old" ? "This device can’t read that code. Try opening the save file instead." : "That code doesn’t look right. Check it was copied completely.";
  }
}
function importCode(target) {
  if (!PENDING) return;
  const d = PENDING;
  let id = target;
  if (target === "new") { id = "p" + Date.now().toString(36) + rnd(99); let name = String(d.n || "Explorer").slice(0, 14); const names = profiles().map(p => p.name.toLowerCase()); let k = 2; while (names.includes(name.toLowerCase())) name = `${String(d.n).slice(0, 11)} ${k++}`; setProfiles(profiles().concat({ id, name, colour: d.c || "blue" })); d.s.name = name; }
  store.set("save:" + id, Object.assign(d.s, { colour: d.c || d.s.colour || "blue" }));
  store.set("progress:" + id, Object.assign(freshProg(), d.p || {}));
  toast("Save loaded! Welcome back.");
  selectProfile(id);
}
function profilesPanel() {
  const list = profiles();
  return `<div class="panel"><h3>Players on this device</h3>
    ${list.length ? list.map(p => { const s = profileSummary(p.id); return `<div class="prow">${trainerPreview(p.colour, 28)}<b>${esc(p.name)}</b><small>📖 ${s.creatures}  🏅 ${s.badges}</small><button class="btn ghost small" data-act="delProfile" data-arg="${p.id}">Delete</button></div>`; }).join("") : `<p class="hint">No players yet.</p>`}
    <p class="hint">Deleting a player removes their game from this device. If they have a save code, it can be loaded again later.</p></div>`;
}
function delProfile(id, el) {
  if (!el.dataset.sure) { el.dataset.sure = "1"; el.textContent = "Tap again"; return; }
  setProfiles(profiles().filter(p => p.id !== id));
  try { localStorage.removeItem("wordwilds:save:" + id); localStorage.removeItem("wordwilds:progress:" + id); } catch (e) {}
  if (activeId() === id) { store.set("activeProfile", null); save = null; prog = freshProg(); }
  showSettings(); app.querySelector("#saved").textContent = "Player deleted.";
}
Object.assign(ACT, {
  team: () => { TEAMSEL = 0; showTeam(); }, teamSlot: i => { TEAMSEL = +i; showTeam(); }, teamPut, evoNext: () => { const f = EVO_NEXT; EVO_NEXT = null; f ? f() : showWorld(); },
  trainerRematch: id => { closeModal(); const n = NPCS.find(x => x.id === id); if (n) trainerChallenge(n, true); }, bQuit,
  online: () => showOnline(), netCreate: () => joinRoom(newCode()), netJoin: () => joinRoom((document.getElementById("joincode") || {}).value),
  netLeave: () => leaveRoom(false), netTrade: pid => netAsk(pid, "trade"), netBattle: pid => netAsk(pid, "battle"), netYes, netNo,
  tradePick, tradeReady, tradeCancel, tradeAfter: id => tradeAfter(id), pvpDone,
  busGo: to => busGo(to), hsTitleClose: () => document.querySelectorAll(".hstitle").forEach(x => x.remove()), hsRematch: id => { closeModal(); startHS(id, true); }, hsAfterBadge, hsGradDone,
  hsLocked: id => toast(`🔒 You need ${HS_REQ[id]} department badges to go there.`),
  trainPick, trainStart: id => trainStart(id), coachSpar, naturePat: id => naturePat(id), natureSwap: a => natureSwap(a),
  bTarget, mythicRematch: id => { closeModal(); startMythic(id, true); },
  worldTrade: pid => { closeModal(); netAsk(pid, "trade"); }, worldBattle: pid => { closeModal(); netAsk(pid, "battle"); }, netEmote
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "joincode") joinRoom(e.target.value); });
Object.assign(ACT, {
  play: () => showProfiles(), profiles: () => showProfiles(), pickProfile: id => selectProfile(id), newProfile: () => { NEWP = { colour: "blue" }; showNewProfile(); },
  pickColour: (c) => { const nm = document.getElementById("pname").value; NEWP.colour = c; showNewProfile(); document.getElementById("pname").value = nm; },
  createProfile, saveMenu: () => showSaveMenu(), copyCode, dlSave, loadCode: () => showLoadCode(), checkCode, importCode: t => importCode(t), delProfile
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "pname") createProfile(); });
showTitle();

</script>
