<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Wilds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#262864; --bg2:#3B3E8E; --ink:#F7F4FF; --muted:#C9CBF0; --panel:#34377E; --panel2:#2A2C69; --line:#5E62B4; --edge:#14112B; --gold:#FFC93C; --goldtext:#FFE08A;
  --tile:#FFD447; --tile-edge:#D9A400; --tile-ink:#3A2A00;
  --attack:#FF7A7A; --skill:#3CC9BB; --power:#B48CF2; --band-ink:#1E1B4B;
  --hp:#E63946; --block:#5B8FF0; --good:#5BE39A; --good-bg:#183D2C; --bad:#FF8A8A; --bad-bg:#4A1F2A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11122E; --bg2:#1D1F4C; --ink:#F4F1FF; --muted:#AEB1DE; --panel:#24265E; --panel2:#1B1C48; --line:#464A9C;
    --good:#5BE39A; --good-bg:#183D2C; --bad:#FF8A8A; --bad-bg:#4A1F2A; --block:#7FA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11122E; --bg2:#1D1F4C; --ink:#F4F1FF; --muted:#AEB1DE; --panel:#24265E; --panel2:#1B1C48; --line:#464A9C;
  --good:#5BE39A; --good-bg:#183D2C; --bad:#FF8A8A; --bad-bg:#4A1F2A; --block:#7FA8FF;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible","Trebuchet MS",Verdana,system-ui,sans-serif;font-size:18px;line-height:1.45}
h1,h2,h3,button,.disp{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
h2{font-size:1.6rem;line-height:1.15;margin:.2em 0 .25em}
p{margin:.3em 0 .7em}
button{font-size:1rem;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--block);outline-offset:3px}
#app{max-width:760px;margin:0 auto;padding:12px 14px 32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:0;border-radius:14px;padding:.6em 1.2em;
  font-weight:800;font-size:1.15rem;background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 var(--tile-edge);min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-edge)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Title */
.hero{text-align:center;padding:28px 0 8px}
.tiles{display:flex;justify-content:center;gap:6px;margin:6px 0}
.tl{width:clamp(46px,13vw,68px);aspect-ratio:1;background:var(--tile);color:var(--tile-ink);border-radius:10px;
  box-shadow:0 5px 0 var(--tile-edge);display:grid;place-items:center;position:relative;
  font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(1.8rem,7vw,2.6rem)}
.tl small{position:absolute;right:6px;bottom:2px;font-size:.75rem;font-weight:700}
.tl:nth-child(odd){transform:rotate(-4deg)} .tl:nth-child(even){transform:rotate(3deg) translateY(-4px)}
.tagline{max-width:32em;margin:8px auto 22px;color:var(--muted)}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:0;margin-top:10px}
.cast>div{width:min(28vw,150px)} .cast .c2{width:min(34vw,180px)}
.hero .row{justify-content:center}
.best{margin-top:18px;color:var(--muted);font-size:.95rem}

/* Top bar */
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--panel);border-radius:14px;
  padding:8px 14px;font-weight:700;font-family:"Baloo 2",system-ui,sans-serif;font-size:1.1rem;margin:0 auto 12px;max-width:560px;border:2px solid var(--line)}

/* Map */
.mapwrap{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start}
.tower{list-style:none;margin:0;padding:8px 6px;background:var(--bg2);border-radius:14px 14px 6px 6px;display:flex;flex-direction:column;gap:5px}
.tower li{height:40px;border-radius:8px;display:grid;place-items:center;font-size:1.2rem;background:var(--panel);border:2px solid var(--line)}
.tower li.cur{background:var(--tile);border-color:var(--tile-edge);color:var(--tile-ink);font-weight:800;font-family:"Baloo 2",system-ui,sans-serif}
.tower li.ahead{opacity:.55}
.node{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:3px solid var(--line);
  border-radius:16px;padding:12px 14px;margin:0 0 12px;min-height:72px}
.node:hover{border-color:var(--block)}
.node .nicon{font-size:2.1rem;line-height:1}
.node b{display:block;font-size:1.25rem}
.node small{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.95rem;color:var(--muted)}
.node.elite{border-color:var(--attack)} .node.boss{border-color:var(--power)}

/* Battle stage */
.stage{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:4/3;border-radius:20px;overflow:hidden;
  border:3px solid var(--line);background:#2a2d45;isolation:isolate}
.scene-bg{position:absolute;inset:0;z-index:0}
.scene-bg svg{width:100%;height:100%;display:block}
.zone-tag{position:absolute;left:10px;top:10px;z-index:3;background:rgba(20,18,50,.75);color:#fff;border-radius:999px;
  padding:2px 12px;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:.85rem}
.fighter{position:absolute;z-index:2}
.sprite{width:100%;height:auto;display:block;overflow:visible}
.fighter.player{left:2%;bottom:18%;width:34%}
.fighter.enemy{right:2%;bottom:18%;width:46%}
.fighter.enemy.elite{width:50%} .fighter.enemy.boss{width:56%;right:0;bottom:16%}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:8px auto 0}
.plate{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:5px 10px 6px;min-width:0}
.pname{display:block;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:1rem;line-height:1.15;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .bar{height:20px} .plate .bar span{line-height:16px;font-size:.8rem}
.plate .chips{margin-top:4px;gap:4px} .plate .chip{font-size:.75rem;padding:1px 8px}
.barrow{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:22px;background:var(--panel2);border-radius:11px;position:relative;overflow:hidden;border:2px solid var(--line)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .35s}
.bar span{position:relative;display:block;text-align:center;font-weight:700;font-size:.85rem;line-height:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.blk{background:var(--block);color:#fff;border-radius:10px;padding:0 8px;font-weight:700;font-size:.95rem;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
.chip.star{background:var(--tile);color:var(--tile-ink)}
.defeated .spr{animation:defeat .9s ease-in forwards}
@keyframes defeat{40%{transform:translateY(-10px) rotate(-6deg)}100%{transform:translateY(30px) scale(.5) rotate(20deg);opacity:0}}
.winbanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;background:var(--tile);color:var(--tile-ink);
  border-radius:18px;padding:8px 22px;text-align:center;box-shadow:0 6px 0 var(--tile-edge);animation:bannerIn .5s cubic-bezier(.3,1.6,.5,1) both}
.winbanner b{display:block;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:2rem;line-height:1.1}
.winbanner[hidden]{display:none}
@keyframes bannerIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.controls{display:flex;align-items:center;gap:12px;margin:12px auto 8px;max-width:560px;min-height:62px}
.energy{width:62px;height:62px;border-radius:50%;background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 var(--tile-edge);
  display:grid;place-items:center;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:1.5rem;flex:none}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tip{text-align:center;color:var(--muted);min-height:1.5em;font-size:.95rem}
.room .fighter.player{left:3%;bottom:13%;width:32%}
.roomtext{max-width:560px;margin:14px auto 0}

/* Tower map */
.towerview{position:relative;width:min(100%,440px);height:clamp(300px,50vh,440px);margin:0 auto 14px;overflow:hidden;
  border-radius:20px;border:3px solid var(--line);background:#11143A}
.towerview svg{display:block;width:100%;height:auto;transition:transform 1.7s cubic-bezier(.45,0,.25,1);will-change:transform}
.tw-wiz{transition:transform 1.7s cubic-bezier(.45,0,.25,1)}
.tw-trail{opacity:0;transition:opacity .4s}
.climbing .tw-trail{opacity:1;animation:twinkle .35s infinite alternate}
.climbing .tw-wiz .sprite .idle{animation:flyWobble .45s ease-in-out infinite alternate}
.tw-new{transform-box:fill-box;transform-origin:center;animation:popIn .6s 1.5s cubic-bezier(.3,1.6,.5,1) both}
.tw-curglow{animation:glowpulse 2.2s ease-in-out infinite}
.tw-star{animation:twinkle 3s ease-in-out infinite}
.tw-cloud{animation:cloudBob 9s ease-in-out infinite alternate}
.mapinfo{max-width:560px;margin:0 auto}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes flyWobble{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes cloudBob{to{transform:translateX(14px)}}

/* Character idle animations (transform-origins are set inline in SVG units) */
.idle{animation:bob 2.6s ease-in-out infinite}
.blink{animation:blink 4.5s infinite}
.orbit{animation:orbit 3.2s ease-in-out infinite}
.o2{animation-delay:-1.1s} .o3{animation-delay:-2.2s}
.squish{animation:squish 1.8s ease-in-out infinite}
.drip{animation:drip 2.4s ease-in infinite} .d2{animation-delay:-1.2s}
.sink{animation:sink 4s ease-in-out infinite} .s2{animation-delay:-1.3s} .s3{animation-delay:-2.6s}
.hover{animation:hover 1.6s ease-in-out infinite}
.wingL{animation:flapL .35s ease-in-out infinite alternate} .wingR{animation:flapR .35s ease-in-out infinite alternate}
.muddle-w .wingL,.heavy .wingL{animation-duration:1.4s} .heavy .wingR{animation-duration:1.4s}
.club{animation:club 2s ease-in-out infinite}
.floaty{animation:floaty 3s ease-in-out infinite}
.jumble{animation:jumble 2.6s ease-in-out infinite} .j2{animation-delay:-.9s} .j3{animation-delay:-1.7s}
.heavy{animation:heavy 3.4s ease-in-out infinite}
.glow{animation:glowpulse 1.6s ease-in-out infinite}
.slither{animation:slither 2.8s ease-in-out infinite}
.tongue{animation:tongue 2.2s ease-in-out infinite}
.dangle{animation:dangle 3.6s ease-in-out infinite}
.puff{animation:puff 2.4s ease-out infinite}
.wand{animation:wand 3s ease-in-out infinite}
.twinkle{animation:spin 6s linear infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes orbit{50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes squish{50%{transform:scale(1.05,.94)}}
@keyframes drip{0%{transform:scaleY(.6)}70%{transform:scaleY(1.6)}100%{transform:scaleY(.6)}}
@keyframes sink{50%{transform:translateY(8px)}}
@keyframes hover{50%{transform:translateY(-10px)}}
@keyframes flapL{from{transform:rotate(14deg)}to{transform:rotate(-16deg)}}
@keyframes flapR{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes club{50%{transform:rotate(-10deg)}}
@keyframes floaty{50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes jumble{50%{transform:translateY(-3px)}}
@keyframes heavy{50%{transform:translateY(2px) scaleY(.99)}}
@keyframes slither{50%{transform:translateX(-4px) skewX(-2deg)}}
@keyframes tongue{0%,60%,100%{transform:scaleX(0)}70%,90%{transform:scaleX(1)}}
@keyframes dangle{50%{transform:rotate(3deg)}}
@keyframes puff{0%{opacity:0;transform:translate(0,0)}30%{opacity:.8}100%{opacity:0;transform:translate(-14px,-10px)}}
@keyframes wand{50%{transform:rotate(-8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scene animations */
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
.f2{animation-duration:.37s}
.glowpulse{animation:glowpulse 2s ease-in-out infinite}
.lightning{opacity:0;animation:lightning 7s infinite}
.bolt{opacity:0;animation:lightning 7s infinite}
.clouds{animation:clouds 30s linear infinite}
.rain{animation:rain .6s linear infinite}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1.2s ease-in-out infinite alternate}
.banner{animation:sway 4s ease-in-out infinite}
.drift{animation:drift 6s ease-in-out infinite}
.breathe{animation:breathe 3s ease-in-out infinite}
.zzz{animation:zzz 3s ease-out infinite}
.sparkles{animation:twinkle 1.4s ease-in-out infinite alternate}
.lid{animation:lid 1s .4s cubic-bezier(.3,1.5,.5,1) both}
.dust{animation:drift 7s ease-in-out infinite}
.inkdrip{transform-box:fill-box;transform-origin:50% 0;animation:drip 3s ease-in infinite}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
@keyframes glowpulse{50%{opacity:.55}}
@keyframes lightning{0%,90%,94%,100%{opacity:0}91%,93%{opacity:.75}92%{opacity:.15}}
@keyframes clouds{to{transform:translateX(-400px)}}
@keyframes rain{from{transform:translate(0,-20px)}to{transform:translate(-6px,0)}}
@keyframes flag{to{transform:skewY(10deg) scaleX(.9)}}
@keyframes sway{50%{transform:rotate(2deg)}}
@keyframes drift{50%{transform:translateY(-8px)}}
@keyframes breathe{50%{transform:scaleY(1.06)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-24px)}}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
@keyframes lid{from{transform:rotate(0)}to{transform:rotate(-24deg)}}
@media (max-width:480px){ .stage:not(.room) .zone-tag{display:none} .intent{max-width:66%} .flip{width:30%;min-width:100px} }

.choice{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:stretch;margin:14px 0 18px}
.flip{display:flex} .flip-in{flex:1;display:flex} .face.front{flex:1;display:flex} .face.front .card{flex:1}

.pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;
  font-size:1.6rem;pointer-events:none;animation:pop 1s ease-out forwards;white-space:nowrap;z-index:3;
  text-shadow:0 2px 0 var(--panel)}
.pop.dmg{color:var(--hp)} .pop.blk{color:var(--block)} .pop.good{color:var(--good)} .pop.info{color:var(--muted)}
@keyframes pop{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-50px}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Speech-bubble intent */
.intent{position:absolute;right:8px;top:8px;z-index:4;max-width:62%;background:#fff;color:#1E1B4B;border-radius:16px;
  padding:5px 12px 6px;border:3px solid var(--ic,#1E1B4B);box-shadow:0 4px 0 rgba(0,0,0,.28);transform-origin:70% 100%}
.intent::after{content:"";position:absolute;bottom:-11px;right:28%;width:16px;height:16px;background:#fff;
  border-right:3px solid var(--ic,#1E1B4B);border-bottom:3px solid var(--ic,#1E1B4B);transform:rotate(45deg)}
.k-attack{--ic:#E63946} .k-block{--ic:#3F7FE8} .k-buff{--ic:#F2A541} .k-debuff{--ic:#9B5DE5} .k-done{--ic:#1E1B4B}
.ibig{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ipart{display:inline-flex;align-items:center;gap:3px}
.ipart svg{width:26px;height:26px;display:block}
.ipart b,.ibig>b{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:1.55rem;line-height:1}
.ipart.atk b{color:#D62839} .ipart.def b{color:#2F67CC}
.ipart small{font-weight:800;font-size:1rem}
.itext{font-size:.78rem;line-height:1.2;color:#3a3870}
.intent.fresh{animation:bubbleIn .45s cubic-bezier(.3,1.6,.5,1)}
.intent.acting{animation:bubbleAct .45s ease-in-out infinite alternate}
@keyframes bubbleIn{from{transform:scale(.3);opacity:0}}
@keyframes bubbleAct{to{transform:scale(1.08);box-shadow:0 0 0 5px var(--ic),0 4px 0 rgba(0,0,0,.28)}}

/* Energy orb, piles and card backs */
.energy{flex-direction:column;line-height:1;gap:0;display:flex;align-items:center;justify-content:center}
.energy span{font-size:.95rem} .energy b{font-size:1.6rem}
.orbpop{animation:orbpop .7s ease-out}
.orbno{animation:orbno .35s}
@keyframes orbpop{35%{transform:scale(1.32);box-shadow:0 0 0 10px rgba(255,212,71,.45),0 0 30px #FFD447,0 4px 0 var(--tile-edge)}}
@keyframes orbno{25%{transform:translateX(-6px);background:#FF8A8A}75%{transform:translateX(6px);background:#FF8A8A}}
.endbtn{flex:1}
.pile{position:relative;width:56px;height:76px;border:0;background:none;padding:0;flex:none;color:var(--ink)}
.stack{position:absolute;left:8px;top:4px;width:40px;height:54px}
.stack .cback{position:absolute;left:calc(var(--i) * 1.5px);top:calc(var(--i) * -2px)}
.cempty{display:block;width:34px;height:46px;border:2px dashed var(--line);border-radius:6px;margin:2px 0 0 2px}
.pcount{position:absolute;right:0;top:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:var(--bg);
  font-weight:800;font-size:.8rem;display:grid;place-items:center;padding:0 5px;font-family:"Baloo 2",system-ui,sans-serif}
.plabel{position:absolute;left:0;right:0;bottom:0;font-size:.75rem;color:var(--muted);font-weight:700;text-align:center}
.pile.bump .stack{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
.cback{display:block;width:34px;height:46px;border-radius:6px;position:relative;border:2px solid #FFD447;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 4px,transparent 4px 8px),linear-gradient(160deg,#4A63E0,#2B2F7A);
  box-shadow:0 2px 0 #1d1b3a,inset 0 0 0 2px #2B2F7A}
.cback::after{content:"W";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);width:16px;height:16px;border-radius:3px;
  background:#FFD447;color:#3A2A00;font:800 11px/16px "Baloo 2","Trebuchet MS",system-ui,sans-serif;text-align:center}
.cback.big{width:100%;height:100%;border-radius:14px;border-width:3px}
.cback.big::after{width:44px;height:44px;border-radius:8px;font-size:30px;line-height:46px;box-shadow:0 3px 0 #9c7400}
.cback.flyback{position:fixed;z-index:40;pointer-events:none}
.cardghost{z-index:40;pointer-events:none}

/* Reward flips */
.flip{perspective:900px;width:140px}
.flip-in{position:relative;transform-style:preserve-3d;animation:flipIn .8s var(--d) cubic-bezier(.3,1.25,.5,1) both}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{position:absolute;inset:0;transform:rotateY(180deg)}
.flip .card,.choice .flip .card{width:100%;min-height:190px}
.flip.passed{transition:opacity .4s,transform .4s;opacity:0;transform:translateY(24px) scale(.9)}
.flip.chosen .card{box-shadow:0 0 0 4px var(--tile),0 0 26px var(--tile)}
@keyframes flipIn{from{transform:translateY(50px) rotateY(180deg)}to{transform:none}}

/* Effects layer */
.fx{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.fxe{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}
.num{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:1.8rem;color:#fff;
  text-shadow:-2px -2px 0 #1d1b3a,2px -2px 0 #1d1b3a,-2px 2px 0 #1d1b3a,2px 2px 0 #1d1b3a,0 4px 0 #1d1b3a;animation:numUp 1.2s ease-out forwards}
.num.big{font-size:2.7rem}
.num.dmg{color:#FF5468} .num.blk{color:#A9C7FF} .num.good{color:#6BEA9B} .num.buff{color:#FFB84D} .num.info{color:#DBBEFF}
@keyframes numUp{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-65%) scale(1.25);opacity:1}
  30%{transform:translate(-50%,-70%) scale(1)}100%{transform:translate(-50%,-170%);opacity:0}}

/* Parchment question scroll */
.scroll{position:relative;width:min(540px,100%);margin:auto}

@keyframes wobble{20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.paper .fb .good{color:#17703E} .paper .fb .bad{color:#B42318}
.stamp{position:absolute;right:18px;bottom:26px;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:1.5rem;
  padding:0 12px;border:4px solid currentColor;border-radius:10px;transform:rotate(-12deg);background:rgba(255,255,255,.55);pointer-events:none;
  animation:stamp .45s cubic-bezier(.3,1.5,.5,1) both}
.stamp[hidden]{display:none}
.stamp.s-good{color:#17803E} .stamp.s-try{color:#2B5BD7}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.8);opacity:0}}
.scroll.glow-good .paper{box-shadow:inset 0 0 34px rgba(140,90,30,.35),0 0 0 4px #FFD447,0 0 34px rgba(255,212,71,.9)}
.qstar{position:absolute;z-index:5;color:#FFC93C;font-size:22px;text-shadow:0 0 6px #fff;pointer-events:none;transform:translate(-50%,-50%);animation:qstar .95s ease-out forwards}
@keyframes qstar{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5) rotate(160deg);opacity:0}}
.scroll.opening .paper{animation:unroll .6s cubic-bezier(.3,.8,.3,1) both}
.scroll.opening .rbot{animation:rodDown .6s cubic-bezier(.3,.8,.3,1) both}
.scroll.opening .rtop{animation:rodDrop .3s ease-out both}
.scroll.closing .paper{animation:rollup .4s ease-in forwards}
.scroll.closing .rbot{animation:rodUp .4s ease-in forwards}
.scroll.closing{animation:fadeOut .4s .15s ease-in forwards}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rollup{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0)}}
@keyframes rodDown{from{transform:translateY(calc(-1 * var(--h) + 24px))}to{transform:none}}
@keyframes rodUp{from{transform:none}to{transform:translateY(calc(-1 * var(--h) + 24px))}}
@keyframes rodDrop{from{transform:translateY(-30px);opacity:0}}
@keyframes fadeOut{to{opacity:0}}

.card.skill{--c1:#8BE8DB;--c2:#1E8C82;--fr:#0D4844}
.card.power{--c1:#DCC2FF;--c2:#7444C2;--fr:#341A63}
.card:hover,.card:focus-visible{transform:translateY(calc(var(--lift,0px) - 10px)) rotate(var(--rot,0deg)) scale(1.04);z-index:3}
.cframe{flex:1;display:flex;flex-direction:column;border-radius:14px;padding:4px;border:2.5px solid var(--edge);
  background:linear-gradient(160deg,var(--c2),var(--fr));position:relative;overflow:hidden}
.card.rare .cframe{background:linear-gradient(150deg,#FFF0B8,#E9B520 35%,#9A6C00 75%,#E9B520)}
.card.rare .cframe::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 48%,transparent 62%);transform:translateX(-130%);animation:shimmer 3.6s ease-in-out infinite}
@keyframes shimmer{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
.cname{display:grid;place-items:center;min-height:32px;padding:3px 5px 3px 18px;border-radius:9px 9px 3px 3px;background:#FFF6DE;
  font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:.84rem;line-height:1.02;color:#1d1b3a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.cart{display:grid;place-items:center;height:50px;margin:3px 0 0;border-radius:6px;border:2px solid rgba(0,0,0,.4);
  background:radial-gradient(circle at 50% 58%,rgba(255,255,255,.6),transparent 52%),
    repeating-conic-gradient(from 0deg at 50% 58%,rgba(255,255,255,.16) 0 10deg,transparent 10deg 20deg),linear-gradient(var(--c1),var(--c2))}
.cicon{font-size:1.85rem;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.ctype{position:relative;z-index:1;align-self:center;margin:-9px 0 2px;padding:0 9px;border-radius:999px;background:var(--edge);color:#fff;
  font-size:.64rem;font-weight:700;letter-spacing:.02em;line-height:16px;border:1.5px solid rgba(255,255,255,.35);white-space:nowrap}
.card.spell .ctype{background:#FFE08A;color:#3A2A00;border-color:var(--edge)}
.card.rare .ctype::after{content:" ✦";color:#FFD447}
.card.rare.spell .ctype::after{color:#9A6C00}
.ctext{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;background:#FFF6DE;border-radius:3px 3px 9px 9px;
  padding:5px 5px 6px;font-size:.74rem;line-height:1.22;color:#2a1d10}
.cboost{display:block;padding-top:3px;border-top:1.5px dashed rgba(154,108,0,.55);font-size:.68rem;line-height:1.2;color:#7A4A00;font-weight:700}
.cost{position:absolute;left:-7px;top:-7px;z-index:2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFF6C0,#FFC93C 45%,#B37E00);color:#3A2A00;border:2.5px solid var(--edge);
  font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:1.05rem;box-shadow:0 2px 0 var(--edge)}
.quill{position:absolute;right:-6px;top:-6px;z-index:2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:#FFF6DE;border:2.5px solid var(--edge);font-size:.78rem;box-shadow:0 2px 0 var(--edge)}
.card.dim{filter:grayscale(.65) brightness(.72) drop-shadow(0 5px 0 rgba(0,0,0,.38))}
.card.weakmatch .cframe{box-shadow:0 0 0 3px #FFD447,0 0 16px 2px #FFD447;animation:weakglow 1.3s ease-in-out infinite alternate}
.card.weakmatch .ctype{background:#B0263A;color:#fff}
@keyframes weakglow{to{box-shadow:0 0 0 3px #FFD447,0 0 4px #FFD447}}
.hand{gap:8px 6px;padding:8px 0 4px}
.choice .flip .card,.flip .card{width:100%;min-height:200px}
.choice .card .ctext{font-size:.82rem}
.grid .card{width:104px}
@media (max-width:420px){ .card{width:104px;min-height:162px} .ctext{font-size:.72rem} .cname{font-size:.8rem} }

/* reward glow */
.choice{position:relative;gap:18px}
@media (max-width:480px){ .choice .flip{width:calc((100% - 36px) / 3);min-width:0} }
.choice::before{content:"";position:absolute;left:50%;top:50%;width:min(520px,110%);height:140%;transform:translate(-50%,-50%);z-index:-1;
  background:radial-gradient(ellipse at center,rgba(255,212,71,.28),transparent 65%);pointer-events:none}

/* map doors */
.node{border-radius:18px;padding:10px 14px}
.node .nicon{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;
  background:radial-gradient(circle at 35% 30%,#4A4E9E,#24265E);border:3px solid #C9962B;box-shadow:0 0 0 2px var(--edge),0 3px 0 var(--edge)}
.node b{color:var(--goldtext);font-size:1.3rem}
.node small{color:var(--muted)}
.node:hover{border-color:var(--gold);transform:translateY(-2px)}
.node.elite{border-color:#E86A6A} .node.elite .nicon{border-color:#E86A6A}
.node.boss{border-color:#B48CF2;box-shadow:0 0 22px rgba(180,140,242,.45),0 4px 0 rgba(0,0,0,.35)}
.node.library .nicon{background:radial-gradient(circle at 35% 30%,#3E8C7E,#1C4A44)}
.node.rest .nicon{background:radial-gradient(circle at 35% 30%,#8A5AB8,#3E2463)}
.node.treasure .nicon{background:radial-gradient(circle at 35% 30%,#B5852B,#5A3E0A)}

/* settings & tables */
textarea{background:rgba(0,0,0,.25);color:var(--ink);border-color:var(--line)}
label.opt input{accent-color:var(--gold)}
table.prog th,table.prog td{border-bottom-color:rgba(255,255,255,.1)}
.missed li{border-top-color:rgba(255,255,255,.1)}
.missed b{color:var(--good)}
.lvlup,.panel .lvlup{background:rgba(255,212,71,.16);color:var(--goldtext)}
.paper .lvlup{background:#FFF1C2;color:#7A4A00}
.lvlstars{color:var(--gold)}

/* title scene */
.titlescene{position:relative;width:100%;max-width:560px;margin:4px auto 0;aspect-ratio:400/430;border-radius:24px;overflow:hidden;
  border:3px solid #C9962B;box-shadow:0 0 0 3px var(--edge),0 10px 0 rgba(0,0,0,.4)}
.titlescene>svg{position:absolute;inset:0;width:100%;height:100%}
.titlescene .logo{position:absolute;left:0;right:0;top:4%;z-index:2}
.titlescene .tl{box-shadow:0 5px 0 var(--tile-edge),0 0 18px rgba(255,212,71,.55)}
.titlescene .cast{position:absolute;left:2%;bottom:3%;width:62%;z-index:2;margin:0;justify-content:flex-start}
.titlescene .cast .c1{width:44%} .titlescene .cast .c2{width:54%}
.flyer .sprite>ellipse:first-child{display:none}
.titlescene .flyer{position:absolute;z-index:2;left:6%;top:41%;width:24%;animation:flee 3.5s ease-in-out infinite alternate}
.hero .tagline{color:var(--ink);opacity:.9}
.hero{padding-top:12px}

/* endings */
.ending{position:relative;width:100%;max-width:560px;margin:0 auto 14px;aspect-ratio:4/3;border-radius:24px;overflow:hidden;
  border:3px solid #C9962B;box-shadow:0 0 0 3px var(--edge),0 10px 0 rgba(0,0,0,.4)}
.ending>svg,.ending .scene-bg{position:absolute;inset:0;width:100%;height:100%}
.ending .sp{position:absolute;z-index:2}
.ending .rays{position:absolute;z-index:1;left:50%;top:58%;width:130%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(rgba(255,224,138,.55) 0 9deg,rgba(255,224,138,0) 9deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spinR 24s linear infinite}
@keyframes spinR{to{transform:translate(-50%,-50%) rotate(360deg)}}
.confetti{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font:800 11px "Baloo 2",system-ui,sans-serif;
  color:#3A2A00;font-style:normal;animation:fall var(--t) linear var(--d) infinite}
@keyframes fall{to{transform:translateY(420px) rotate(var(--r))}}
.ending .bubble{position:absolute;z-index:4;background:#fff;color:#1E1B4B;border:3px solid var(--edge);border-radius:16px;padding:4px 12px;
  font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:1.05rem;animation:bubbleIn .5s .6s cubic-bezier(.3,1.6,.5,1) both}
.ending .dizzy{position:absolute;z-index:3;color:#FFD447;font-size:1.1rem;animation:dizzy 1.6s linear infinite}
@keyframes dizzy{from{transform:rotate(0deg) translateX(26px) rotate(0deg)}to{transform:rotate(360deg) translateX(26px) rotate(-360deg)}}
.ending .flee{animation:flee 3.5s ease-in-out infinite alternate}
@keyframes flee{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(18px,-14px) rotate(6deg)}}
.endtitle{text-align:center;font-size:2rem;margin:4px 0 2px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:4px 0}
.bigstars span{font-size:2.8rem;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4));animation:starPop .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars span.off{filter:grayscale(1) brightness(.5);opacity:.6}
@keyframes starPop{from{transform:scale(0) rotate(-40deg)}}

/* ===================== WORD WILDS ===================== */
.sr{position:absolute;left:-9999px}
#app{padding-bottom:96px}
.wtop{align-items:center}
.wtop .tbtn{border:0;background:rgba(0,0,0,.25);color:var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:1rem;min-height:34px}
.tchip{display:inline-block;background:var(--tc);color:#fff;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;border:2px solid var(--edge);vertical-align:middle}
.rstars{color:#FFD447;letter-spacing:1px;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--edge);color:#fff;
  border:2px solid #C9962B;border-radius:14px;padding:8px 16px;font-weight:700;max-width:90vw;text-align:center;animation:bubbleIn2 .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubbleIn2{from{transform:translateX(-50%) scale(.6);opacity:0}}

/* bottom nav */
.wnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;gap:6px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,17,43,.85),#14112B);border-top:2px solid #C9962B}
.wnav button{flex:1;max-width:160px;border:0;background:transparent;color:var(--muted);border-radius:14px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.85rem;min-height:52px}
.wnav button span{font-size:1.4rem;line-height:1.1}
.wnav button.on{background:rgba(255,212,71,.16);color:var(--goldtext)}

/* title */
.wtitle{aspect-ratio:4/3.6}
.wtitle .scene-bg svg{width:100%;height:100%}
.wtitle .logo{position:absolute;left:0;right:0;top:4%;z-index:2}
.lineup{position:absolute;left:0;right:0;bottom:2%;display:flex;justify-content:center;align-items:flex-end;z-index:2}
.flyer2{position:absolute;right:6%;top:40%;width:20%;z-index:2;animation:flee 3s ease-in-out infinite alternate}
.flyer2 .sprite>ellipse:first-child{display:none}

/* starters */
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:14px auto}
.starter{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px 12px;border-radius:18px;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.1)),var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.starter:hover{border-color:var(--gold);transform:translateY(-3px)}
.starter b{color:var(--goldtext);font-size:1.1rem}
.starter small{font-size:.75rem;line-height:1.25;color:var(--muted);font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.pedestal{display:block;width:100%;background:radial-gradient(ellipse at 50% 85%,rgba(255,212,71,.35),transparent 60%)}
@media (max-width:420px){ .starter small{display:none} }
.bigsp{width:min(220px,60%);margin:0 auto}
.dexcard .bigsp{background:radial-gradient(circle at 50% 60%,rgba(255,212,71,.25),transparent 65%)}

/* island map */
.island{position:relative;width:100%;max-width:520px;margin:0 auto 12px;aspect-ratio:4/5;border-radius:24px;overflow:hidden;
  border:3px solid #C9962B;box-shadow:0 0 0 3px var(--edge),0 8px 0 rgba(0,0,0,.4)}
.island>svg{position:absolute;inset:0;width:100%;height:100%}
.zpin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;color:#1d1b3a;z-index:2}
.zicon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:radial-gradient(circle at 35% 30%,#fff,#FFE9A8);
  border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge),0 0 0 4px rgba(255,255,255,.5);animation:pinbob 2.4s ease-in-out infinite}
.zpin:nth-child(odd) .zicon{animation-delay:-1.2s}
@keyframes pinbob{50%{transform:translateY(-4px)}}
.zpin b{margin-top:3px;background:#fff;border:2px solid var(--edge);border-radius:10px;padding:0 7px;font-size:.78rem;line-height:1.35;white-space:nowrap}
.zpin small{background:var(--edge);color:#FFE08A;border-radius:8px;padding:0 6px;font-size:.68rem;font-weight:700;margin-top:2px}
.zpin:hover .zicon{transform:scale(1.1)}
.smoke{animation:drift 4s ease-in-out infinite}
.bob{animation:drift 3s ease-in-out infinite}
.buddycard{display:flex;gap:12px;align-items:center;max-width:520px;margin:0 auto;padding:8px 14px;border-radius:18px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.1)),var(--panel);border:2px solid #C9962B;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.buddycard .bsp{width:82px;flex:none}
.binfo{flex:1;min-width:0} .binfo b{color:var(--goldtext);font-size:1.15rem;font-family:"Baloo 2",system-ui,sans-serif}
.binfo small{display:block;color:var(--muted)}
.xpbar{height:14px;border-radius:7px;background:rgba(0,0,0,.35);border:2px solid var(--edge);overflow:hidden;margin:4px 0 2px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD447,#FF9F1C);border-radius:5px;transition:width .5s}
.xpbar.big{height:18px}

/* zone */
.zname{text-align:center;margin:0}
.zsub{text-align:center;color:var(--muted);margin:0 0 8px;font-size:.95rem}
.zsub b{color:var(--goldtext)}
.stage.zone{cursor:pointer}
.grass{position:absolute;width:21%;transform:translate(-50%,-50%);border:0;background:none;padding:0;z-index:2}
.grass svg{display:block;width:100%;overflow:visible}
.grass .blades{transform-origin:50% 95%}
.grass.rustling .blades{animation:rustle .28s ease-in-out infinite alternate}
.grass.rustling::after{content:"!";position:absolute;left:50%;top:-30%;transform:translateX(-50%);font:800 1.4rem "Baloo 2",system-ui,sans-serif;color:#E63946;
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff;animation:drift .6s ease-in-out infinite}
.grass.found .blades{animation:rustle .1s ease-in-out infinite alternate}
@keyframes rustle{from{transform:rotate(-5deg) translateX(-2px)}to{transform:rotate(5deg) translateX(2px)}}
.walker{position:absolute;width:30%;transform:translate(-50%,-100%);transition:left .7s ease-in-out,top .7s ease-in-out;z-index:3;pointer-events:none;display:flex;align-items:flex-end}
.walker .wz{width:62%} .walker .wb{width:46%;margin-left:-14%}
.walker.walking .wz,.walker.walking .wb{animation:walkbob .25s ease-in-out infinite alternate}
@keyframes walkbob{to{transform:translateY(-6px)}}
.zlist{display:flex;justify-content:center;gap:6px;margin:6px auto;max-width:560px}
.zmini{width:52px;border-radius:12px;background:rgba(0,0,0,.2);border:2px solid var(--line)}
.zmini.got{border-color:#C9962B;background:rgba(255,212,71,.12)}

/* encounter */
.wipe{position:fixed;inset:-50%;z-index:40;pointer-events:none;
  background:repeating-conic-gradient(#14112B 0 15deg,#FFD447 15deg 30deg);animation:wipe 1.05s ease-in-out forwards}
@keyframes wipe{0%{transform:scale(0) rotate(0);opacity:1}45%{transform:scale(1.2) rotate(120deg);opacity:1}100%{transform:scale(1.2) rotate(200deg);opacity:0}}
.stage.enc .spot{position:absolute;left:50%;top:70%;width:62%;height:16%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.65),transparent 70%);z-index:1}
.wild{position:absolute;left:50%;bottom:16%;width:46%;transform:translateX(-50%);z-index:2;animation:wildIn .7s cubic-bezier(.3,1.5,.5,1) both}
.wild.isnew::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 65%);z-index:-1}
@keyframes wildIn{from{transform:translateX(-50%) translateY(40px) scale(.2);opacity:0}}
.wild.caught{animation:caught 1.1s ease-in forwards}
@keyframes caught{30%{transform:translateX(-50%) scale(1.08);filter:brightness(2.5)}100%{transform:translateX(-50%) translateY(30%) scale(.05);filter:brightness(4);opacity:0}}
.wild.fled{animation:fled .6s ease-in forwards}
@keyframes fled{to{transform:translateX(160%) translateY(-10px) rotate(15deg);opacity:0}}
.wizback{position:absolute;left:2%;bottom:2%;width:26%;z-index:2;opacity:.95}
.encinfo{max-width:560px;margin:10px auto 0;text-align:center}
.ename{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.7rem;color:var(--goldtext);display:flex;justify-content:center;align-items:center;gap:8px}
.newtag{background:#E63946;color:#fff;border:2px solid var(--edge);border-radius:8px;padding:0 8px;font-size:.85rem;transform:rotate(-6deg)}
.emeta{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.rname{color:var(--muted);font-size:.9rem}
.hearts{margin:8px 0 2px;min-height:58px}
.hrow{display:flex;justify-content:center;gap:8px}
.heart{font-size:2rem;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.heart.full{animation:starPop .45s cubic-bezier(.3,1.6,.5,1)}
.hearts small{color:var(--muted)}
.fx{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.fheart{position:absolute;font-size:1.4rem;pointer-events:none;animation:fheart 1.2s ease-out forwards}
@keyframes fheart{from{transform:translate(-50%,0) scale(.4);opacity:0}20%{opacity:1}to{transform:translate(-50%,-90px) scale(1.1);opacity:0}}
.book{position:absolute;left:50%;bottom:6%;width:30%;transform:translateX(-50%);z-index:3;animation:bookIn 1.3s ease-out both}
.book svg{display:block;width:100%;overflow:visible}
.bk-l{transform-origin:60px 45px;animation:bkL 1.3s ease-in-out both} .bk-r{transform-origin:60px 45px;animation:bkR 1.3s ease-in-out both}
@keyframes bookIn{0%{opacity:0;transform:translateX(-50%) translateY(20px)}15%{opacity:1;transform:translateX(-50%)}100%{opacity:1}}
@keyframes bkL{0%,70%{transform:none}100%{transform:scaleX(-.02)}}
@keyframes bkR{0%,70%{transform:none}100%{transform:scaleX(.02)}}
.gotcha{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;background:var(--tile);color:var(--tile-ink);border:3px solid var(--edge);
  border-radius:18px;padding:6px 18px;text-align:center;box-shadow:0 6px 0 var(--edge);animation:bannerIn .5s cubic-bezier(.3,1.6,.5,1) both;max-width:88%}
.gotcha b{display:block;font-family:"Baloo 2",system-ui,sans-serif;font-size:2rem;line-height:1.05}
.newentry{color:var(--goldtext);font-weight:700;font-size:1.1rem;margin:14px 0 0}

/* evolution */
.evo{max-width:520px;margin:20px auto;text-align:center}
.evomsg{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.5rem;color:var(--goldtext);min-height:2.4em}
.evostage{position:relative;width:min(300px,80%);aspect-ratio:1;margin:0 auto 16px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,212,71,.12) 50%,transparent 70%)}
.evostage>div{position:absolute;inset:0;pointer-events:none}
.evoa{animation:evoA 4.2s steps(1) forwards} .evob{opacity:0;animation:evoB 4.2s steps(1) forwards}
.evoa .sprite,.evob .sprite{filter:brightness(0) invert(1)}
.evodone .evob .sprite{filter:none;transition:filter .6s}
.evoflash{background:radial-gradient(circle,#fff 40%,transparent 70%);opacity:0;animation:evoFlash 4.2s ease-out forwards}
@keyframes evoA{0%{opacity:1}30%{opacity:0}36%{opacity:1}52%{opacity:0}56%{opacity:1}66%{opacity:0}69%{opacity:1}76%{opacity:0}78%{opacity:1}83%{opacity:0}85%{opacity:1}89%,100%{opacity:0}}
@keyframes evoB{0%{opacity:0}30%{opacity:1}36%{opacity:0}52%{opacity:1}56%{opacity:0}66%{opacity:1}69%{opacity:0}76%{opacity:1}78%{opacity:0}83%{opacity:1}85%{opacity:0}89%,100%{opacity:1}}
@keyframes evoFlash{0%,86%{opacity:0;transform:scale(.5)}92%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(1.8)}}

function seeded(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
/* ---------- modal & questions ---------- */
function showModal(html) { ov.innerHTML = html; ov.hidden = false; const f = ov.querySelector(".ans, button"); if (f) f.focus({ preventScroll: true }); }
function closeModal() { ov.hidden = true; ov.innerHTML = ""; }
function fmtQ(t) { return esc(t).replace(/\n/g, "<br>").replace(/_{3}/g, '<span class="blank"></span>'); }

function askQuestion(heading, sub, cb, o = {}) {
  const q = nextQ(o);
  const opts = shuffle([q.a, ...q.w]);
  qState = { q, opts, cb, done: false, ok: false };
  const lv = q.cat !== "custom" ? starsFor(topicState(q.cat).lvl) : 0;
  const card = o.card ? CARDS[o.card] : null;
  const extra = (card ? `<div class="spellcard"><span class="sci" aria-hidden="true">${card.icon}</span><span><b>${card.name}</b><small>Right answer: ${card.boost}<br>Wrong answer: ${card.text}</small></span></div>` : "")
    + (o.weak && q.cat === o.weak ? `<div class="weakbanner">💥 This is the ${esc(o.foe)}’s weak spot! A right answer also hits it for ${weakDmg()} damage.</div>` : "")
    + (q.review ? `<div class="reviewtag">🔁 You missed this one earlier. Try it again!</div>` : "");
  ov.innerHTML = `<div class="scroll" role="dialog" aria-modal="true" aria-labelledby="qh">
    <div class="rod rtop" aria-hidden="true"></div>
    <div class="paper">
      <div class="qtop"><span class="ribbon">${esc(TOPIC_SHORT[q.cat] || "Teacher’s question")}${lv ? `<span class="lvl" aria-label="${LEVEL_NAME[lv]} level"> ${starText(lv)}</span>` : ""}</span>
      <button class="icon" data-act="read" aria-label="Read the question aloud">🔊</button></div>
      <h2 id="qh" class="qhead">${esc(heading)}</h2>${sub ? `<p class="qsub">${esc(sub)}</p>` : ""}${extra}
      <p class="qtext">${fmtQ(q.q)}</p>
      <div class="answers">${opts.map((o, i) => `<button class="ans" data-act="answer" data-arg="${i}"><span class="seal" aria-hidden="true">${"ABCD"[i]}</span><span class="atext">${esc(o)}</span></button>`).join("")}</div>
      <div class="fb" aria-live="polite"></div>
      <div class="stamp" aria-hidden="true" hidden></div>
    </div>
    <div class="rod rbot" aria-hidden="true"></div></div>`;
  ov.hidden = false;
  const sc = ov.querySelector(".scroll"), paper = sc.querySelector(".paper");
  sc.style.setProperty("--h", paper.offsetHeight + "px");
  sc.classList.add("opening");
  const f = ov.querySelector(".ans"); if (f) f.focus({ preventScroll: true });
  if (settings.autoRead) speakQ();
}
function answer(i) {
  if (!qState || qState.done) return;
  qState.done = true;
  const { q, opts } = qState;
  const chose = opts[i], ok = chose === q.a;
  qState.ok = ok;
  const lu = recordAnswer(q, ok);
  const btns = ov.querySelectorAll(".ans");
  btns.forEach((b, j) => {
    b.disabled = true;
    if (opts[j] === q.a) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });
  const sc = ov.querySelector(".scroll"), stamp = ov.querySelector(".stamp");
  stamp.className = "stamp " + (ok ? "s-good" : "s-try"); stamp.textContent = ok ? "Correct!" : "Nearly!"; stamp.hidden = false;
  sc.classList.add(ok ? "glow-good" : "glow-try");
  if (ok && !reduced) {
    const b = btns[i], r = b.getBoundingClientRect(), pr = sc.getBoundingClientRect();
    for (let k = 0; k < 12; k++) {
      const a = Math.PI * 2 * k / 12, s = document.createElement("span");
      s.className = "qstar"; s.textContent = k % 3 ? "★" : "✦";
      s.style.left = (r.left - pr.left + 30) + "px"; s.style.top = (r.top - pr.top + r.height / 2) + "px";
      s.style.setProperty("--dx", Math.cos(a) * (60 + Math.random() * 50) + "px");
      s.style.setProperty("--dy", Math.sin(a) * (40 + Math.random() * 40) + "px");
      sc.appendChild(s); setTimeout(() => s.remove(), 1000);
    }
  }
  const why = q.why ? `<p>${esc(q.why)}</p>` : "";
  ov.querySelector(".fb").innerHTML = (ok
    ? `<p class="good">⭐ Correct! Brilliant work.</p>${why}`
    : `<p class="bad">Not quite. The answer is “${esc(q.a)}”.</p>${why}`)
    + (lu ? `<p class="lvlup">🎉 ${TOPIC_SHORT[lu.cat]} level up! You’re now an ${LEVEL_NAME[lu.stars]} ${starText(lu.stars)}</p>` : "")
    + `<button class="btn" data-act="qcontinue">Continue</button>`;
  ov.querySelector('[data-act="qcontinue"]').focus({ preventScroll: true });
}
function qContinue() {
  if (!qState || qState.closing) return;
  try { speechSynthesis.cancel(); } catch (e) {}
  qState.closing = true;
  const { cb, ok, q } = qState;
  const sc = ov.querySelector(".scroll");
  const finish = () => { qState = null; closeModal(); cb(ok, q); };
  if (!sc || reduced) return finish();
  sc.style.setProperty("--h", sc.querySelector(".paper").offsetHeight + "px");
  sc.classList.remove("opening"); sc.classList.add("closing");
  setTimeout(finish, 420);
}

function speakQ() {
  if (!qState || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const t = qState.q.q.replace(/_{3}/g, " blank ").replace(/\n/g, ". ") + ". Is it: " + qState.opts.join(", or ") + "?";
    const u = new SpeechSynthesisUtterance(t); u.lang = "en-GB"; u.rate = 0.9; speechSynthesis.speak(u);
  } catch (e) {}
}

const CF = "'Baloo 2','Trebuchet MS',system-ui,sans-serif";

  return `<g class="blink" style="transform-origin:${cx}px ${cy}px"><ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * 1.12}" fill="#fff" stroke="${OL}" stroke-width="3"/>
    <ellipse cx="${cx + r * .12}" cy="${cy + r * .15}" rx="${r * .62}" ry="${r * .7}" fill="${OL}"/><circle cx="${cx - r * .12}" cy="${cy - r * .22}" r="${r * .3}" fill="#fff"/><circle cx="${cx + r * .32}" cy="${cy + r * .42}" r="${r * .13}" fill="#fff"/></g>
    ${fierce ? `<path d="M${cx - r * 1.1} ${cy - r * 1.35} L${cx + r * .9} ${cy - r * 1.05}" stroke="${OL}" stroke-width="4" stroke-linecap="round" transform="${cx > 100 ? `scale(-1 1) translate(${-2 * cx} 0)` : ""}"/>` : ""}`;

/* ===================== ADVENTURE: story, quests, gyms, eggs, items ===================== */

const route = () => ROUTE_ALL.filter(id => areaTopics(id).length > 0);
const STRONG = { spelling: "homophones", homophones: "punctuation", punctuation: "grammar", grammar: "wordclass", wordclass: "affixes", affixes: "vocab", vocab: "spelling" };
const MOVES = { spelling: "Letter Launch", homophones: "Echo Blast", punctuation: "Comma Clobber", wordclass: "Noun Pound", grammar: "Tense Twister", affixes: "Prefix Punch", vocab: "Synonym Storm", legend: "Dictionary Drop" };
const SHOP = [
  { id: "berry", name: "Word Berry", icon: "🫐", price: 15, desc: "Wild creature: get 1 extra question. Battle: heal 20 HP." },
  { id: "book", name: "Golden Book", icon: "📒", price: 40, desc: "Wild creature: start with 1 heart already filled." },

const EGG_NEED = 12, MAX_EGGS = 3;

function migrateSave() {
  if (!save) return;
  if (save.coins == null) save.coins = 0;
  if (save.items == null) save.items = { berry: 1, book: 0 };
  if (save.eggs == null) save.eggs = [];
  if (save.badges == null) save.badges = {};
  if (save.claimed == null) save.claimed = {};
  if (save.right == null) save.right = {};

}
function unlockedZones() {
  const r = route();

  const k = r.findIndex(t => !save.badges[t]), earned = k < 0 ? r.length : k + 1;
  return r.slice(0, Math.max(1, earned));
}
function allBadges() { const r = route(); return r.length > 0 && r.every(t => save.badges[t]); }

/* ---------- rewards for right answers ---------- */
function onRightAnswer(area) {
  save.coins += 2;
  if (area) save.right[area] = (save.right[area] || 0) + 1;
  let ready = false;
  save.eggs.forEach(e => { if (e.have < e.need) { e.have++; if (e.have >= e.need) ready = true; } });

}

/* ---------- dialogue ---------- */
let DLG = null;

    "Our school grounds are full of wild word creatures, and they love clever English.",

  const z = open.find(t => !save.badges[t]) || r.find(t => !save.badges[t]);

}

/* ---------- quests ---------- */
function zoneQuests(z) {

  return [
    { id: z + "-catch", text: `Make friends with 2 different creatures in ${name}`, prog: Math.min(2, ((save.areaCaught || {})[z] || []).length), goal: 2, reward: { coins: 20, berry: 1 } },
    { id: z + "-right", text: `Answer 8 questions right in ${name}`, prog: Math.min(8, save.right[z] || 0), goal: 8, reward: { coins: 20 } },
    { id: z + "-gym", text: `Beat ${L.name} and win the ${L.badge}`, prog: save.badges[z] ? 1 : 0, goal: 1, reward: { coins: 50, egg: AREA[z].topics.length === 1 ? AREA[z].topics[0] : "mystery" } }

}
function gymReady(z) { const q = zoneQuests(z); return q[0].prog >= q[0].goal && q[1].prog >= q[1].goal; }
function rewardText(r) {
  return [r.coins ? `🪙 ${r.coins}` : "", r.berry ? `🫐 ${r.berry}` : "", r.book ? `📒 ${r.book}` : "", r.egg ? `🥚 ${r.egg === "mystery" ? "Mystery egg" : TYPE_INFO[r.egg].name + " egg"}` : ""].filter(Boolean).join("  ");
}
function questRow(q) {

  const q = allQuests().find(x => x.id === id);

/* ---------- eggs ---------- */
function addEgg(type) { save.eggs.push({ id: Date.now() + "" + rnd(999), type, have: 0, need: EGG_NEED }); persist(); }
function hatchEgg(id) {
  const egg = save.eggs.find(e => e.id === id); if (!egg || egg.have < egg.need) return;
  const types = egg.type === "mystery" ? enabledCats() : [egg.type];
  let pool = SPECIES_LIST.filter(s => s.stage === 1 && types.includes(s.type));
  if (!pool.length) pool = SPECIES_LIST.filter(s => s.stage === 1);
  const fresh = pool.filter(s => !owned(s.id));
  const sp = pick(fresh.length ? fresh : pool), shiny = Math.random() < 1 / 8;
  save.eggs = save.eggs.filter(e => e !== egg);
  const ent = save.team[sp.id] || (save.team[sp.id] = { n: 0, xp: 0, shiny: false });
  ent.n++; if (shiny) ent.shiny = true; save.seen[sp.id] = true; save.hatched++; persist();
  app.dataset.screen = "hatch"; setMusic(null); jingle("evolve");
  app.innerHTML = `<section class="evo hatch"><p class="evomsg" id="hmsg">Oh? The egg is moving!</p>
    <div class="evostage"><div class="hegg">${eggSVG(egg.type, 3)}</div><div class="hbaby">${creatureSVG(sp, { shiny })}</div><div class="evoflash"></div></div>
    <div class="row" style="justify-content:center" id="hbtn"></div></section>`;
  setTimeout(() => {
    document.querySelector(".hatch").classList.add("hatched"); jingle("catch");
    document.getElementById("hmsg").innerHTML = `A ${shiny ? "✨ shiny " : ""}<b>${sp.name}</b> hatched! ${typeChip(sp.type)}`;
    document.getElementById("hbtn").innerHTML = `<button class="btn" data-act="bag">Hooray!</button><button class="btn ghost" data-act="dexInfo" data-arg="${sp.id}">See it</button>`;
  }, reduced ? 100 : 3200);
}

/* ---------- gyms ---------- */
function gymTeam(z, champion) {
  if (champion) return ["alphawolf", "questiosaur", "megafox"].map(id => ({ sp: SPECIES[id], hpMax: 62, atk: 13 }))
    .concat([{ sp: SPECIES.thesaurex, hpMax: 92, atk: 15 }]);
  const i = Math.max(0, ROUTE_ALL.indexOf(z)), list = areaSpecies(z), a = AREA[z];
  let picks;
  if (a.topics.length === 1) picks = i < 2 ? [list[0], list[2]] : [list[0], list[2], list[1]];
  else { const evo = shuffle(list.filter(s => s.stage === 2)); picks = evo.slice(0, 3); }
  return picks.map(s => ({ sp: s, hpMax: (s.stage === 1 ? 34 : 52) + i * 4, atk: 7 + Math.round(i * 0.8) }));
}

  const pre = mine.slice().sort((a, b) => score(b) - score(a)).slice(0, 3).map(s => s.id);
  G = { z, champion, pick: pre };
  const who = champion ? PRINCIPAL.name : `${LEADERS[z].name} (${AREA[z].cls})`;

    <p class="center">Pick up to 3 creatures to battle ${who}.${strongTypes.length ? ` <b class="tip-strong">💥 ${TYPE_INFO[strongTypes[0]].name} creatures are strong against ${TYPE_INFO[foeType].name}!</b>` : ""}</p>
    <div class="dexgrid pickgrid">${mine.map(s => `<button class="dexcell got pickc ${pre.includes(s.id) ? "picked" : ""}" data-act="togglePick" data-arg="${s.id}" aria-pressed="${pre.includes(s.id)}">

    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="startGym">⚔️ Battle!</button></div>`;

let G = null, BT = null;

    mine: G.pick.map(id => { const sp = SPECIES[id], st = battleStats(sp); return { sp, ...st, hp: st.hpMax, shiny: save.team[id].shiny }; }),

const foeArt = f => creatureSVG(f.sp);
function hpBar(c) { const p = Math.max(0, Math.round(c.hp / c.hpMax * 100)); return `<div class="bhp"><i style="width:${p}%" class="${p < 25 ? "low" : p < 50 ? "mid" : ""}"></i></div><small>${Math.max(0, c.hp)} / ${c.hpMax}</small>`; }
function renderBattle() {
  app.dataset.screen = "battle"; setMusic(BT.champion ? "champion" : "gym");
  const z = BT.champion ? { ...ZONE.custom, id: "office", sky: ["#14306E", "#6B8FD8"], g1: "#C9B79A", g2: "#B5A283", deco: "garden" } : ZONE[BT.z];

/* ---------- particles (world space) ---------- */
const PARTS = [];
function addPart(p) { if (PARTS.length < 160) PARTS.push(Object.assign({ age: 0, life: 1000, vx: 0, vy: 0, size: 2 }, p)); }
function dust(x, y) { for (let i = 0; i < 3; i++) addPart({ kind: "dust", x: x + 4 + Math.random() * 8, y: y + 14, vx: (Math.random() - 0.5) * 0.02, vy: -0.01, life: 380, size: 2 + Math.random() * 2 }); }
function leaves(x, y) { for (let i = 0; i < 5; i++) addPart({ kind: "leaf", x: x + 3 + Math.random() * 10, y: y + 8, vx: (Math.random() - 0.5) * 0.06, vy: -0.05 - Math.random() * 0.04, g: 0.00018, life: 600, col: Math.random() < 0.5 ? "#3FA34F" : "#7CD67B" }); }
const fallP = cols => (cx, cy) => ({ kind: "fall", x: cx + Math.random() * VW * TS, y: cy - 4, vx: 0.006, vy: 0.016, sway: Math.random() * 6, life: 9000, col: pick(cols), size: 2 });
const driftP = cols => (cx, cy) => ({ kind: "fall", x: cx - 4, y: cy + Math.random() * VH * TS * 0.8, vx: 0.022, vy: 0.004, sway: Math.random() * 6, life: 9000, col: pick(cols), size: 2 });
const AMBIENT = {
  possums: { rate: 0.004, make: (cx, cy) => ({ kind: "firefly", x: cx + Math.random() * VW * TS, y: cy + Math.random() * VH * TS, vx: (Math.random() - 0.5) * 0.01, vy: (Math.random() - 0.5) * 0.01, life: 5000, ph: Math.random() * 6 }) },
  emus: { rate: 0.0025, make: driftP(["#8B6B4A", "#B5946E", "#F4E9D8"]) },
  bilbies: { rate: 0.004, make: driftP(["#E8A06A", "#F2C08F"]) },
  kangaroos: { rate: 0.003, make: driftP(["#FF9AB5", "#FFE3EC", "#FFE066"]) },
  swans: { rate: 0.003, make: (cx, cy) => Math.random() < 0.5 ? { kind: "bubble", x: cx + Math.random() * VW * TS, y: cy + VH * TS, vx: 0, vy: -0.015, sway: Math.random() * 6, life: 8000, size: 2 + Math.round(Math.random() * 2) } : fallP(["#fff", "#F4F6FF"])(cx, cy) },
  numbats: { rate: 0.003, make: (cx, cy) => ({ kind: "spark", x: cx + Math.random() * VW * TS, y: cy + Math.random() * VH * TS, vx: 0, vy: -0.006, life: 2400, col: pick(["#C9A6FF", "#FFE066", "#fff"]), size: 1 }) },
  bobtails: { rate: 0.004, make: fallP(["#8FB07A", "#B5C98A", "#C9A46A"]) },
  karaks: { rate: 0.004, make: fallP(["#E63946", "#B0263A", "#1d1b3a"]) },
  wombats: { rate: 0.004, make: (cx, cy) => ({ kind: "ember", x: cx + Math.random() * VW * TS, y: cy + VH * TS + 4, vx: (Math.random() - 0.5) * 0.01, vy: -0.015, life: 6000, col: pick(["#C9A46A", "#A07850"]), size: 1 }) },
  office: { rate: 0.003, make: (cx, cy) => ({ kind: "spark", x: cx + Math.random() * VW * TS, y: cy + Math.random() * VH * TS, vx: 0, vy: -0.004, life: 2400, col: pick(["#FFD447", "#fff"]), size: 1 }) }
};
function updateParts(dt, camX, camY) {
  const reg = W.region, a = AMBIENT[reg];
  if (a && Math.random() < a.rate * dt) addPart(a.make(camX, camY));
  if (isNight() && ["possums", "emus", "kangaroos", "swans", "numbats", "gate", "custom"].includes(reg) && Math.random() < 0.004 * dt)
    addPart({ kind: "firefly", x: camX + Math.random() * VW * TS, y: camY + Math.random() * VH * TS, vx: (Math.random() - 0.5) * 0.01, vy: (Math.random() - 0.5) * 0.01, life: 5000, ph: Math.random() * 6 });
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i]; p.age += dt;
    if (p.age > p.life) { PARTS.splice(i, 1); continue; }
    if (p.g) p.vy += p.g * dt;
    p.x += p.vx * dt + (p.sway ? Math.sin((p.age / 600) + p.sway) * 0.15 : 0); p.y += p.vy * dt;

}
function drawParts(g, now) {
  for (const p of PARTS) {
    const k = 1 - p.age / p.life, x = Math.round(p.x), y = Math.round(p.y);
    switch (p.kind) {
      case "dust": g.fillStyle = `rgba(240,230,210,${0.7 * k})`; g.fillRect(x, y, Math.round(p.size), Math.round(p.size)); break;
      case "leaf": g.fillStyle = p.col; g.fillRect(x, y, 2, 1); break;
      case "fall": g.fillStyle = p.col; g.globalAlpha = Math.min(1, k * 3); g.fillRect(x, y, p.size, p.size); g.globalAlpha = 1; break;
      case "ember": g.fillStyle = p.col; g.globalAlpha = Math.min(1, k * 2); g.fillRect(x, y, p.size, p.size); g.globalAlpha = 1; break;
      case "bubble": g.strokeStyle = `rgba(220,245,255,${Math.min(1, k * 2)})`; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, p.size, p.size); break;
      case "spark": { const on = Math.sin(p.age / 120) > 0; g.fillStyle = p.col; g.globalAlpha = k; g.fillRect(x, y, 1, 1); if (on) { g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); } g.globalAlpha = 1; break; }
      case "gull": { const f = Math.floor(now / 220) % 2; g.fillStyle = "#fff"; g.fillRect(x, y + (f ? 0 : 1), 3, 1); g.fillRect(x + 3, y + 1, 1, 1); g.fillRect(x + 4, y + (f ? 0 : 1), 3, 1); g.fillStyle = "#1d1b3a"; g.fillRect(x + 3, y + 2, 1, 1); break; }
      case "mist": g.fillStyle = `rgba(155,93,229,${0.12 * Math.sin(Math.PI * p.age / p.life)})`; g.beginPath(); g.ellipse(x, y, p.size * 1.8, p.size, 0, 0, Math.PI * 2); g.fill(); break;
    }
  }
}
function drawFireflies(g) {
  for (const p of PARTS) if (p.kind === "firefly") {
    const a = Math.max(0, Math.sin(p.age / 300 + p.ph)) * Math.sin(Math.PI * p.age / p.life);
    const grd = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, 5); grd.addColorStop(0, `rgba(255,240,140,${a})`); grd.addColorStop(1, "rgba(255,240,140,0)");
    g.fillStyle = grd; g.fillRect(p.x - 5, p.y - 5, 10, 10);
    g.fillStyle = `rgba(255,255,200,${a})`; g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
  }
}

/* ---------- day & night (follows the device clock) ---------- */
function hourNow() { return W && W.forceHour !== undefined ? W.forceHour : new Date().getHours(); }
function phase() { const h = hourNow(); return h >= 21 || h < 6 ? "night" : h < 9 ? "morning" : h < 17 ? "day" : "evening"; }
function isNight() { return settings.daynight !== false && phase() === "night"; }
const PHASE_ICON = { morning: "🌅", day: "☀️", evening: "🌇", night: "🌙" };
let DARK = null;
function drawLighting(g, camX, camY, windows) {
  if (settings.daynight === false) return;
  const ph = phase();
  if (ph === "day") return;
  if (ph !== "night") { g.fillStyle = ph === "morning" ? "rgba(255,190,120,.14)" : "rgba(255,110,70,.2)"; g.fillRect(camX, camY, VW * TS, VH * TS); return; }
  if (!DARK) { DARK = document.createElement("canvas"); DARK.width = VW * TS; DARK.height = VH * TS; }
  const d = DARK.getContext("2d");
  d.globalCompositeOperation = "source-over"; d.clearRect(0, 0, DARK.width, DARK.height);
  d.fillStyle = "rgba(8,10,44,.68)"; d.fillRect(0, 0, DARK.width, DARK.height);
  d.globalCompositeOperation = "destination-out";
  const hole = (x, y, r, s = 1) => { const grd = d.createRadialGradient(x, y, 0, x, y, r); grd.addColorStop(0, `rgba(0,0,0,${s})`); grd.addColorStop(1, "rgba(0,0,0,0)"); d.fillStyle = grd; d.fillRect(x - r, y - r, r * 2, r * 2); };
  hole(W.fx * TS + 8 - camX, W.fy * TS + 8 - camY, 38, 0.85);
  windows.forEach(([x, y]) => hole(x - camX, y - camY, 14, 0.7));
  g.drawImage(DARK, camX, camY);
  g.globalCompositeOperation = "lighter";
  windows.forEach(([x, y]) => { const grd = g.createRadialGradient(x, y, 0, x, y, 12); grd.addColorStop(0, "rgba(255,200,90,.35)"); grd.addColorStop(1, "rgba(255,200,90,0)"); g.fillStyle = grd; g.fillRect(x - 12, y - 12, 24, 24); });
  g.globalCompositeOperation = "source-over";
}

/* ---------- hidden treasures (refresh every day) ---------- */
let HIDDEN = [];
function placeTreasures() {
  HIDDEN = []; const r = seeded(77);
  const regions = ["gate", "possums", "emus", "bilbies", "kangaroos", "swans", "numbats", "bobtails", "karaks", "wombats"];
  const groundOK = new Set([".", "m", "g", "q", "s", "v", "p", "r", "F"]);
  for (const reg of regions) {
    const cands = [];
    for (let y = 2; y < MH - 2; y++) for (let x = 2; x < MW - 2; x++)
      if (REGION[y][x] === reg && groundOK.has(MAP[y][x]) && !NPCS.some(n => Math.abs(n.x - x) + Math.abs(n.y - y) < 2) && MAP[y - 1][x] !== "D" && MAP[y + 1] && MAP[y + 1][x] !== "D") cands.push([x, y]);
    for (let k = 0; k < (reg === "gate" ? 1 : 2) && cands.length; k++) { const i = Math.floor(r() * cands.length); const [x, y] = cands.splice(i, 1)[0]; HIDDEN.push({ id: reg + k, x, y }); }
  }
}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function foundToday() { if (!save.found || save.found.day !== today()) save.found = { day: today(), ids: [] }; return save.found.ids; }
function treasureAt(x, y) { return HIDDEN.find(h => h.x === x && h.y === y && !foundToday().includes(h.id)); }
function drawTreasures(g, now, camX, camY) {
  for (const h of HIDDEN) {
    if (foundToday().includes(h.id)) continue;
    const X = h.x * TS, Y = h.y * TS; if (X < camX - 16 || Y < camY - 16 || X > camX + VW * TS || Y > camY + VH * TS) continue;
    const t = (now / 500 + h.x) % 2, s = t < 1 ? 1 : 0;
    g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(X + 5, Y + 12, 6, 2);
    g.fillStyle = "#FFE066"; g.fillRect(X + 7, Y + 4 - s, 2, 8 + s * 2); g.fillRect(X + 4 - s, Y + 7, 8 + s * 2, 2);
    g.fillStyle = "#fff"; g.fillRect(X + 7, Y + 7, 2, 2);
    if (s) { g.fillStyle = "#FFF7C2"; g.fillRect(X + 3, Y + 3, 1, 1); g.fillRect(X + 12, Y + 11, 1, 1); }
  }
}
function pickUpTreasure(h) {
  foundToday().push(h.id); save.treasures = (save.treasures || 0) + 1;
  const r = seeded((h.x * 31 + h.y * 17 + today().length * 7 + new Date().getDate() * 13) % 233280)();
  let msg, icon;
  if (r < 0.55) { const n = 10 + Math.floor(r * 30); save.coins += n; msg = `You found 🪙 ${n} Word Coins!`; icon = "🪙"; }
  else if (r < 0.85) { save.items.berry++; msg = "You found a 🫐 Word Berry!"; icon = "🫐"; }
  else if (r < 0.95) { save.items.book++; msg = "You found a 📒 Golden Book! Wow!"; icon = "📒"; }

function rollSpecies(z) {
  const caughtKinds = Object.keys(save.team).length;
  if (caughtKinds >= 10 && Math.random() < 0.025) return caughtKinds >= 25 && Math.random() < 0.5 ? SPECIES.inktopus : SPECIES.thesaurex;
  let pool = areaSpecies(z.id);
  if (z.id !== "custom") { const t = areaTopics(z.id); const p2 = pool.filter(s => t.includes(s.type)); if (p2.length) pool = p2; }
  const hard = AREA[z.id] && AREA[z.id].hard;
  const w = s => s.stage === 1 ? (hard ? 20 : s.rarity === 1 ? 50 : 30) : (hard ? 22 : 10);
  const total = pool.reduce((a, s) => a + w(s), 0);

  for (const s of pool) { if ((r -= w(s)) < 0) return s; }
  return pool[0];
}

const b64u = bytes => { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = str => { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };
async function pipe(bytes, stream) { const out = new Response(new Blob([bytes]).stream().pipeThrough(stream)); return new Uint8Array(await out.arrayBuffer()); }
async function encodeSave() {
  const p = profiles().find(x => x.id === activeId()) || {};
  const slim = JSON.parse(JSON.stringify(save)); delete slim.seenAt;
  const pg = { cats: prog.cats, asked: prog.asked };
  const json = JSON.stringify({ v: 2, n: p.name || save.name, c: p.colour || save.colour, s: slim, p: pg });
  const raw = new TextEncoder().encode(json);
  if (window.CompressionStream) { try { return "WW2-" + b64u(await pipe(raw, new CompressionStream("deflate-raw"))); } catch (e) {} }
  return "WW2U-" + b64u(raw);
}
async function decodeSave(code) {
  const c = (code || "").replace(/\s+/g, "");
  let bytes;
  if (c.startsWith("WW2-")) { if (!window.DecompressionStream) throw new Error("old"); bytes = await pipe(unb64u(c.slice(4)), new DecompressionStream("deflate-raw")); }
  else if (c.startsWith("WW2U-")) bytes = unb64u(c.slice(5));
  else throw new Error("format");
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || d.v !== 2 || !d.s || typeof d.s !== "object") throw new Error("format");
  return d;
}

  app.dataset.screen = "loadcode"; PENDING = null;
  app.innerHTML = `<h2 class="center">🔑 Load a save code</h2>
    <div class="panel"><p class="hint">Paste your save code here, or open a save file.</p>
      <textarea id="lcode" class="codebox" placeholder="WW2-…" aria-label="Paste your save code"></textarea>
      <div class="row"><button class="btn" data-act="checkCode">Check code</button>
        <label class="btn ghost filebtn">📂 Open save file<input type="file" id="lfile" accept=".txt,text/plain" hidden></label></div>
      <p class="tip" id="lmsg" aria-live="polite"></p><div id="lprev"></div></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="profiles">Back</button></div>`;
  document.getElementById("lfile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    document.getElementById("lcode").value = (await f.text()).trim(); checkCode();
  });
}
async function checkCode() {
  const m = document.getElementById("lmsg"), pv = document.getElementById("lprev");
  try {
    const d = await decodeSave(document.getElementById("lcode").value);
    PENDING = d;
    const n = Object.keys(d.s.team || {}).length, bd = Object.values(d.s.badges || {}).filter(Boolean).length;
    m.textContent = "";
    const same = profiles().find(p => p.name.toLowerCase() === String(d.n || "").toLowerCase());
    pv.innerHTML = `<div class="pcard big">${trainerPreview(d.c || "blue")}<b>${esc(d.n || "Explorer")}</b><small>📖 ${n}/${SPECIES_LIST.length}  🏅 ${bd}  🪙 ${d.s.coins || 0}</small></div>
      <div class="row" style="justify-content:center">${same ? `<button class="btn" data-act="importCode" data-arg="${same.id}">Update ${esc(same.name)}’s game</button>` : ""}<button class="btn ${same ? "ghost" : ""}" data-act="importCode" data-arg="new">Add as a new player</button></div>`;
  } catch (e) {
    PENDING = null; pv.innerHTML = "";
    m.textContent = e.message === "old" ? "This device can’t read that code. Try opening the save file instead." : "That code doesn’t look right. Check it was copied completely.";
  }
}
function importCode(target) {
  if (!PENDING) return;
  const d = PENDING;
  let id = target;
  if (target === "new") { id = "p" + Date.now().toString(36) + rnd(99); let name = String(d.n || "Explorer").slice(0, 14); const names = profiles().map(p => p.name.toLowerCase()); let k = 2; while (names.includes(name.toLowerCase())) name = `${String(d.n).slice(0, 11)} ${k++}`; setProfiles(profiles().concat({ id, name, colour: d.c || "blue" })); d.s.name = name; }
  store.set("save:" + id, Object.assign(d.s, { colour: d.c || d.s.colour || "blue" }));
  store.set("progress:" + id, Object.assign(freshProg(), d.p || {}));
  toast("Save loaded! Welcome back.");
  selectProfile(id);
}
function profilesPanel() {
  const list = profiles();
  return `<div class="panel"><h3>Players on this device</h3>
    ${list.length ? list.map(p => { const s = profileSummary(p.id); return `<div class="prow">${trainerPreview(p.colour, 28)}<b>${esc(p.name)}</b><small>📖 ${s.creatures}  🏅 ${s.badges}</small><button class="btn ghost small" data-act="delProfile" data-arg="${p.id}">Delete</button></div>`; }).join("") : `<p class="hint">No players yet.</p>`}
    <p class="hint">Deleting a player removes their game from this device. If they have a save code, it can be loaded again later.</p></div>`;
}
function delProfile(id, el) {
  if (!el.dataset.sure) { el.dataset.sure = "1"; el.textContent = "Tap again"; return; }
  setProfiles(profiles().filter(p => p.id !== id));
  try { localStorage.removeItem("wordwilds:save:" + id); localStorage.removeItem("wordwilds:progress:" + id); } catch (e) {}
  if (activeId() === id) { store.set("activeProfile", null); save = null; prog = freshProg(); }
  showSettings(); app.querySelector("#saved").textContent = "Player deleted.";
}
Object.assign(ACT, {
  play: () => showProfiles(), profiles: () => showProfiles(), pickProfile: id => selectProfile(id), newProfile: () => { NEWP = { colour: "blue" }; showNewProfile(); },
  pickColour: (c) => { const nm = document.getElementById("pname").value; NEWP.colour = c; showNewProfile(); document.getElementById("pname").value = nm; },
  createProfile, saveMenu: () => showSaveMenu(), copyCode, dlSave, loadCode: () => showLoadCode(), checkCode, importCode: t => importCode(t), delProfile
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "pname") createProfile(); });
showTitle();

</script>
</body>
</html>
